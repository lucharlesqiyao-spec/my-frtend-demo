<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Charles</title>

    <script>
        let x = 66
        function showMessage() {
            verifyName()
            // alert("X value is : " + x);
            console.log("I am here boy. x:", x);


        }

        function verifyName() {
            var nameValue = document.getElementById("name").value;
            if (nameValue.length >= 20) {
                alert("Name length must <= 20")
            }
            console.log("input name:", nameValue);
        }
    </script>
</head> 

<body> 
    <h2>Student Form</h2>
    <form action="/" method="post">
        <!-- 文本输入框 -->
        <label for="name">Student name:</label>
        <input type="text" id="name" name="name">

        <br>

        <!-- 密码输入框 -->
        <label for="password">Student age:</label>
        <input type="text" id="age" name="age" required>

        <br>

        <!-- 单选按钮 -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male" checked>
        <label for="male">male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label>

        <br>

        <!-- 复选框 -->
        <label for="fav">fav: </label>
        <input type="checkbox" id="football" name="football" checked>
        <label for="football">football</label>
        <input type="checkbox" id="swimming" name="swimming">
        <label for="swimming">swimming</label>
        <input type="checkbox" id="soccer" name="soccer" <label for="soccer">soccer</label>
        <input type="checkbox" id="basketball" name="basketball">
        <label for="basketball">basketball</label>
        <input type="checkbox" id="dancing" name="dancing">
        <label for="dancing">dancing</label>
        <input type="checkbox" id="singing" name="singing">
        <label for="singing">football</label>

        <br>
        <!-- 提交按钮 -->
        <button onclick="showMessage()"> 提交</button>
    </form>
    

</body>
